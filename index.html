<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI야! 내 책을 찾아줘! (수정판)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(135deg, #e3f2fd 0%, #fff9c4 100%);
    margin: 0; padding: 20px; min-height: 100vh;
  }
  .container {
    max-width: 720px; margin: 0 auto; background: #ffffff;
    border-radius: 24px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .deco-icons { text-align:center; font-size:18px; color:#78909c; margin-bottom:8px; font-weight:bold; }
  .title-section { text-align: center; margin-bottom: 24px; }
  .main-title { font-size: 30px; font-weight: 900; color: #2e7d32; margin-bottom: 6px; }
  .subtitle { font-size: 15px; color: #78909c; margin-bottom: 10px; }
  .instruction { font-size: 17px; color: #37474f; font-weight: bold; }
  .word-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    max-height: 420px; overflow-y: auto; padding: 10px; margin-top: 16px;
  }
  .word-btn {
    padding: 10px 6px; border: none; border-radius: 14px; font-size: 14px; font-weight: bold;
    background: linear-gradient(135deg, #90caf9 0%, #64b5f6 100%); color: #fff; cursor: pointer;
    min-height: 78px; transition: transform 0.15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .word-btn .word-icon { font-size: 28px; line-height: 1; }
  .word-btn .word-label { line-height: 1.2; }
  .word-btn:hover { transform: translateY(-2px); }
  .word-btn:active { transform: scale(0.96); }
  .hidden { display: none; }
  .result-view { display: none; }
  .result-view.active { display: block; }
  .result-header { text-align: center; margin-bottom: 20px; }
  .theme-icon { font-size: 64px; margin: 6px 0; }
  .theme-result { font-size: 28px; font-weight: 900; color: #e65100; margin-bottom: 4px; }

  /* 청구기호 박스: 화면에서 가장 크고 눈에 띄게 (핵심 행동 유도) */
  .call-number-box {
    background: linear-gradient(135deg, #fff59d 0%, #ffd54f 100%);
    border: 4px solid #f9a825; border-radius: 20px; padding: 24px; margin: 20px 0;
    text-align: center;
  }
  .call-number-label { font-size: 18px; font-weight: bold; color: #6d4c00; margin-bottom: 8px; }
  .call-number-value { font-size: 44px; font-weight: 900; color: #d84315; letter-spacing: 1px; }

  /* 도우미에게 보여달라는 지시문: 짧은 한 줄 + 큰 아이콘 */
  .action-notice {
    background: linear-gradient(135deg, #a5d6a7 0%, #66bb6a 100%); color: #fff;
    border-radius: 18px; padding: 20px; text-align: center; margin: 16px 0;
    font-size: 19px; font-weight: bold; line-height: 1.6;
  }
  .action-notice .big-icon { font-size: 36px; display:block; margin-bottom: 8px; }

  .mic-section { text-align: center; margin: 6px 0 18px; }
  .mic-btn {
    padding: 16px 32px; border: none; border-radius: 999px; font-size: 18px; font-weight: bold;
    background: linear-gradient(135deg, #ef9a9a 0%, #e57373 100%); color: #fff; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12); transition: transform 0.15s;
  }
  .mic-btn:active { transform: scale(0.96); }
  .mic-btn:disabled { background: #cfd8dc; cursor: not-allowed; }
  .mic-btn.listening { background: linear-gradient(135deg, #ff8a80 0%, #ff5252 100%); animation: pulse 1s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,82,82,0.5); }
    70% { box-shadow: 0 0 0 14px rgba(255,82,82,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,82,82,0); }
  }
  .mic-status { margin-top: 10px; font-size: 15px; color: #37474f; font-weight: bold; min-height: 20px; }
  .or-divider { text-align:center; color:#90a4ae; font-size:13px; margin: 4px 0 12px; font-weight:bold; }

  .button-group { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  button.btn-replay {
    background: linear-gradient(135deg, #ba68c8 0%, #9c27b0 100%);
  }
  button.btn-reset {
    padding: 14px 40px; border: none; border-radius: 14px; font-size: 17px; font-weight: bold;
    cursor: pointer; background: linear-gradient(135deg, #81c784 0%, #4caf50 100%); color: #fff;
  }
  @media (max-width: 600px) {
    .main-title { font-size: 24px; }
    .word-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">

  <div class="title-section">

  </div>

    <div class="word-grid" id="wordGrid"></div>

    <div class="call-number-box">

    <div class="action-notice">

      <span class="big-icon">🔎</span>
      숫자가 붙은 칸에서<br>마음에 드는 책을 골라요!
    </div>

    <div class="action-notice" style="background: linear-gradient(135deg, #ffcc80 0%, #ffa726 100%);">

      어려우면 선생님께<br>도와달라고 말해도 돼요!
    </div>

    <div class="button-group">

      <button class="btn-reset" onclick="resetGame()">🔄 다시 하기</button>

  '보드게임', '비밀', '영화', '아이돌', '용돈', '보물찾기', '비밀번호', '시험', '일기장', '세계 여행',
  '유튜버', '체육시간', '탐정', '도자기',
  // 보통: 대체로 알아볼 수 있으나 약간의 설명이 도움이 되는 단어
  '방탈출', '부자', '드론', '초능력', '애니메이션', '떡볶이', '탕후루', '한글', '타임머신',
  // 애매함: 그림만으로는 뜻을 유추하기 어려운 단어 (교사의 언어적 설명 병행 권장)
  '미라·피라미드', '조선시대', '메타버스', '만화책', '슬라임', '숏폼·릴스', '종이접기'
];

let selectedWord = null;
let selectedTheme = null;

function initGame() {
  const grid = document.getElementById('wordGrid');
  grid.innerHTML = '';
  const words = wordDisplayOrder;
  words.forEach(word => {
    const btn = document.createElement('button');
    btn.className = 'word-btn';
    const icon = wordToIcon[word] || '⭐';
    btn.innerHTML = `<span class="word-icon" aria-hidden="true">${icon}</span><span class="word-label">${word}</span>`;
    btn.onclick = () => selectWord(word);
    grid.appendChild(btn);
  });
}

// 수정: 랜덤 제거 → 항상 첫 번째 테마로 고정 매칭 (재현성 확보)
function selectWord(word) {
  selectedWord = word;

  const availableThemes = wordToThemes[word];
  selectedTheme = availableThemes[0]; // 고정 매칭 (랜덤 삭제됨)

  document.getElementById('wordView').classList.add('hidden');
  document.getElementById('resultView').classList.add('active');

  document.getElementById('themeText').textContent = selectedTheme;

  const themeData = themes[selectedTheme];
  document.getElementById('themeEmoji').textContent = themeData.emoji;

  // 청구기호 표시
  document.getElementById('callNumberText').textContent = themeToCallNumber[selectedTheme];

  speakResult();
}

// ===== 결과 읽어주기(음성 합성) =====
function speakResult() {
  if (!('speechSynthesis' in window)) return;
  if (!selectedTheme) return;

  window.speechSynthesis.cancel(); // 이전에 읽던 것이 있으면 중단하고 새로 시작

  const themeData = themes[selectedTheme];
  const callNumber = themeToCallNumber[selectedTheme];
  const message =
    `${selectedTheme} 책이에요! ${themeData.description} ` +
    `청구기호는 ${callNumber} 입니다. 이 번호를 보고 책장으로 가서, ` +
    `숫자가 붙은 칸에서 마음에 드는 책을 골라보세요!`;

  const utterance = new SpeechSynthesisUtterance(message);
  utterance.lang = 'ko-KR';
  utterance.rate = 0.95;
  utterance.pitch = 1.05;
  window.speechSynthesis.speak(utterance);
}

function resetGame() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  selectedWord = null;
  selectedTheme = null;
  document.getElementById('wordView').classList.remove('hidden');
  document.getElementById('resultView').classList.remove('active');
  const micStatus = document.getElementById('micStatus');
  if (micStatus) micStatus.textContent = '';
  initGame();
}

// ===== 음성인식(마이크) 기능 =====
let recognition = null;
let isListening = false;

// 말한 단어를 목록 단어와 매칭 (공백 무시, 정확일치 → 부분일치 순서로 시도)
function findMatchingWord(transcript) {
  const clean = transcript.replace(/\s+/g, '');
  const words = Object.keys(wordToThemes).sort((a, b) => b.length - a.length);

  for (const w of words) {
    if (clean === w.replace(/\s+/g, '')) return w;
  }
  for (const w of words) {
    const wClean = w.replace(/\s+/g, '');
    if (clean.includes(wClean) || wClean.includes(clean)) return w;
  }
  return null;
}

function setupSpeechRecognition() {
  const micBtn = document.getElementById('micBtn');
  const micStatus = document.getElementById('micStatus');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    micBtn.disabled = true;
    micBtn.textContent = '🎤 이 브라우저는 음성인식이 안 돼요';
    micStatus.textContent = '크롬(Chrome) 브라우저에서 다시 열어보거나, 단어를 터치해주세요!';
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'ko-KR';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 5;

  recognition.onstart = () => {
    isListening = true;
    micBtn.textContent = '🔴 듣고 있어요...';
    micBtn.classList.add('listening');
    micStatus.textContent = '지금 좋아하는 단어를 말해보세요!';
  };

  recognition.onresult = (event) => {
    const results = event.results[0];
    let matchedWord = null;
    let heardText = '';

    for (let i = 0; i < results.length; i++) {
      const transcript = results[i].transcript.trim();
      if (i === 0) heardText = transcript;
      const match = findMatchingWord(transcript);
      if (match) { matchedWord = match; heardText = transcript; break; }
    }

    if (matchedWord) {
      micStatus.textContent = `"${heardText}"(이)라고 들었어요! 🎉`;
      setTimeout(() => selectWord(matchedWord), 600);
    } else {
      micStatus.textContent = `"${heardText}"(이)라고 들린 것 같아요. 목록에 있는 단어로 다시 말해볼까요?`;
    }
  };

  recognition.onerror = (event) => {
    if (event.error === 'not-allowed' || event.error === 'permission-denied' || event.error === 'service-not-allowed') {
      micStatus.textContent = '마이크 사용을 허락해주세요! 🎙️';
    } else if (event.error === 'no-speech') {
      micStatus.textContent = '아무 소리도 못 들었어요. 마이크 버튼을 다시 눌러 말해보세요!';
    } else {
      micStatus.textContent = '앗, 잘 안 들렸어요. 다시 눌러서 시도해봐요!';
    }
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.textContent = '🎤 말로 골라요!';
    micBtn.classList.remove('listening');
  };

  micBtn.addEventListener('click', () => {
    if (isListening) {
      recognition.stop();
      return;
    }
    try {
      recognition.start();
    } catch (e) {
      micStatus.textContent = '마이크를 시작할 수 없어요. 다시 눌러보세요!';
    }
  });
}

initGame();
setupSpeechRecognition();
</script>
